spring.application.name=students-api-dto

# Default profile uses H2 for local execution/tests
spring.datasource.url=jdbc:h2:mem:academia;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Pagination limits (protect the API)
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

